# Configuracion de vsftpd
listen=YES
listen_ipv6=NO

anonymous_enable=NO
local_enable=YES
write_enable=YES
local_umask=022
pam_service_name=vsftpd

userlist_enable=YES
userlist_deny=NO
userlist_file=/etc/vsftpd.user_list

chroot_local_user=YES

allow_writeable_chroot=YES

pasv_enable=YES
pasv_min_port=30000
pasv_max_port=30100

xferlog_enable=YES
xferlog_file=/var/log/vsftpd.log
ftpd_banner=Servidor FTP ASO

seccomp_sandbox=NO