---
- name: "[PGSQL] Iniciar y habilitar PostgreSQL (initdb automatico)"
  ansible.builtin.systemd_service:
    name: "{{ postgresql_servicio }}"
    state: started
    enabled: true

- name: "[PGSQL] Generar certificado SSL autofirmado (solo la primera vez)"
  ansible.builtin.shell: |
    set -e
    umask 077
    openssl req -new -x509 -nodes -days {{ postgresql_ssl_dias }} \
      -newkey rsa:2048 -subj "/CN={{ postgresql_ssl_cn }}" \
      -keyout server.key -out server.crt 2>/dev/null
    chown postgres:postgres server.key server.crt
    chmod 600 server.key
  args:
    chdir: "{{ postgresql_data }}"
    creates: "{{ postgresql_data }}/server.crt"
  notify: Reiniciar postgresql

- name: copiar archivo postgresql.conf
  ansible.builtin.copy:
    src: ../../postgresql.conf
    dest: /var/lib/pgsql/data/postgresql.conf
    owner: postgres
    group: postgres
    mode: '0644'
  notify: Reiniciar postgresql

- name: copiar archivo pg_hba.conf
  ansible.builtin.copy:
    src: ../../pg_hba.conf
    dest: /var/lib/pgsql/data/pg_hba.conf
    owner: postgres
    group: postgres
    mode: '0644'
  notify: Reiniciar postgresql

- name: "[PGSQL] Clave de postgres + usuario y base de la aplicacion"
  ansible.builtin.command:
    cmd: runuser -u postgres -- psql -X -v ON_ERROR_STOP=1 -d postgres
    chdir: /
    stdin: |
      ALTER USER postgres WITH PASSWORD '{{ postgresql_password | replace("'", "''") }}';
      SELECT 'CREATE USER {{ postgresql_usuario }} LOGIN SUPERUSER'
        WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = '{{ postgresql_usuario }}')\gexec
      ALTER USER {{ postgresql_usuario }} WITH SUPERUSER LOGIN PASSWORD '{{ postgresql_usuario_password | replace("'", "''") }}';
      SELECT 'CREATE DATABASE {{ postgresql_db }} OWNER {{ postgresql_usuario }}'
        WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = '{{ postgresql_db }}')\gexec
  register: postgresql_sql
  changed_when: "'CREATE ROLE' in postgresql_sql.stdout or 'CREATE DATABASE' in postgresql_sql.stdout"
  no_log: true
