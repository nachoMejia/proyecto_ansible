---
- name: " Ajustar zypp.conf"
  ansible.builtin.blockinfile:
    path: /etc/zypp/zypp.conf
    create: true
    mode: "0644"
    marker: "# {mark} ANSIBLE - optimizacion deploy"
    block: |
      [main]
      rpm.install.excludedocs = {{ 'yes' if instalador_zypp_excludedocs else 'no' }}
      download.max_concurrent_connections = {{ instalador_zypp_conexiones_paralelas }}

- name: "Importar llaves GPG de repositorios externos"
  ansible.builtin.rpm_key:
    key: "{{ item.clave }}"
    state: present
  loop: "{{ instalador_repos }}"
  loop_control:
    label: "{{ item.nombre }}"

- name: "Agregar repositorios externos"
  community.general.zypper_repository:
    name: "{{ item.nombre }}"
    repo: "{{ item.url }}"
    auto_import_keys: true
    runrefresh: false
    state: present
  loop: "{{ instalador_repos }}"
  loop_control:
    label: "{{ item.nombre }}"

- name: "Instalar TODOS los paquetes en una sola transaccion"
  community.general.zypper:
    name: "{{ instalador_paquetes_todos }}"
    state: present
    disable_recommends: true
  environment: "{{ instalador_zypper_env }}"
  register: instalador_instalacion
  retries: 2
  delay: 5
  until: instalador_instalacion is succeeded


- name: "SELinux - aplicar booleanos y contextos en una sola transaccion"
  ansible.builtin.shell: |
    set -u
    if ! command -v selinuxenabled >/dev/null 2>&1 || ! selinuxenabled; then
      echo "SELINUX_DESACTIVADO"; exit 0
    fi
    tmp=$(mktemp)
    {% for b in instalador_selinux_booleanos %}
    if v=$(getsebool {{ b }} 2>/dev/null); then
      case "$v" in *"--> off") echo "boolean -m -1 {{ b }}" >> "$tmp" ;; esac
    fi
    {% endfor %}
    locales=$(semanage fcontext -l -C 2>/dev/null || true)
    {% for f in instalador_selinux_fcontext %}
    printf '%s\n' "$locales" | grep -qF -- '{{ f.ruta }}' || \
      echo "fcontext -a -t {{ f.tipo }} '{{ f.ruta }}'" >> "$tmp"
    {% endfor %}
    if [ -s "$tmp" ]; then
      if ! semanage import -f "$tmp"; then
        echo "ERROR en semanage import:"; cat "$tmp"; rm -f "$tmp"; exit 1
      fi
      echo "CAMBIOS_APLICADOS"
      {% for f in instalador_selinux_fcontext %}
      [ -e '{{ f.dir }}' ] && restorecon -R '{{ f.dir }}'
      {% endfor %}
    fi
    rm -f "$tmp"
    exit 0
  args:
    executable: /bin/bash
  register: instalador_selinux
  changed_when: "'CAMBIOS_APLICADOS' in instalador_selinux.stdout"
  when: instalador_selinux_booleanos | length > 0 or instalador_selinux_fcontext | length > 0

- name: "[BASE] Firewall - abrir servicios y puertos en una sola pasada"
  ansible.builtin.shell: |
    set -u
    if ! systemctl is-active --quiet firewalld; then
      echo "FIREWALLD_INACTIVO"; exit 0
    fi
    cambio=0; error=0
    for s in {{ instalador_firewall_servicios | join(' ') }}; do
      firewall-cmd --permanent --query-service="$s" >/dev/null 2>&1 && continue
      if firewall-cmd --permanent --add-service="$s" >/dev/null; then cambio=1
      else echo "ERROR servicio $s"; error=1; fi
    done
    for p in {{ instalador_firewall_puertos | join(' ') }}; do
      firewall-cmd --permanent --query-port="$p" >/dev/null 2>&1 && continue
      if firewall-cmd --permanent --add-port="$p" >/dev/null; then cambio=1
      else echo "ERROR puerto $p"; error=1; fi
    done
    if [ "$cambio" -eq 1 ]; then firewall-cmd --reload >/dev/null && echo "CAMBIOS_APLICADOS"; fi
    exit $error
  args:
    executable: /bin/bash
  register: instalador_firewall
  changed_when: "'CAMBIOS_APLICADOS' in instalador_firewall.stdout"
  when: instalador_firewall_servicios | length > 0 or instalador_firewall_puertos | length > 0