---
- name: "Crear el usuario FTP en linux"
  ansible.builtin.user:
    name: "{{ ftp_usuario }}"
    password: "{{ ftp_usuario_password | password_hash('sha512', (ftp_usuario | hash('sha1'))[:16]) }}"
    group: users
    shell: /bin/bash
    create_home: true
    state: present
  no_log: true

- name: "Copiar archivo vsftpd.conf"
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/vsftpd.conf"
    dest: /etc/vsftpd.conf
    owner: root
    group: root
    mode: "0600"
  notify: Reiniciar vsftpd

- name: "Permitir solo a mi usuario entrar por FTP"
  ansible.builtin.copy:
    content: "{{ ftp_usuario }}\n"
    dest: /etc/vsftpd.user_list
    owner: root
    group: root
    mode: "0600"
  notify: Reiniciar vsftpd

- name: "Iniciar y habilitar vsftpd desde el arranque"
  ansible.builtin.systemd_service:
    name: "{{ ftp_servicio }}"
    state: started
    enabled: true