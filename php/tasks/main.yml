- name: Instalar PHP, integración con Apache, extensiones y phpMyAdmin
  zypper:
    name:
      - "{{ php8_package }}"
      - "{{ php_apache_package }}"
      - "{{ php_mysql_package }}"
      - "{{ phpMyAdmin_package }}"
      - "{{ phpMyAdmin_apache_package }}"
    state: present
  notify: Reiniciar apache2
